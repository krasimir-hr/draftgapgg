<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DraftGap</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong scheme.
      (function () {
        try {
          var t = localStorage.getItem('dg-theme'); // 'light' | 'dark' | 'system'
          var dark =
            t === 'dark' ||
            ((t === 'system' || !t) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
